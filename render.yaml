services:
  - type: web
    name: fintrack
    runtime: docker
    dockerfilePath: ./Containerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Kolkata
